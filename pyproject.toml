[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.8.2"]

[project]
name = "mzn-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Jip J. Dekker", email = "jip@dekker.one" }]
requires-python = ">=3.10"
dependencies = ["click>=8.1.7", "minizinc>=0.9.0", "ruamel-yaml>=0.18.6"]

[project.scripts]
mzn-bench = 'mzn_bench.cli:main'

[project.optional-dependencies]
scripts = ["pandas>=2.2.3", "pytest>=8.3.4", "tabulate>=0.9.0"]
plotting = ["bokeh>=3.6.2", "matplotlib>=3.10.1", "seaborn>=0.13.2"]
